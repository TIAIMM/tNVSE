name: Apply atlas placement cache patch

on:
  push:
    branches:
      - develop_unstable
    paths:
      - .github/workflows/apply-atlas-placement-cache-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop_unstable
          fetch-depth: 0

      - name: Patch source and remove temporary automation
        run: |
          python3 .github/scripts/apply_atlas_placement_cache_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Persist atlas placement data in prewarm snapshots"
          git push origin HEAD:develop_unstable
