[FreeTypeFont]
; Render font IDs configured under <fonts> in tnvse_fonts.xml with FreeType
; vector outlines. This switch is independent of bEnableMultibyteFontHook.
; With Multibyte disabled, text uses Windows-1252. With Multibyte enabled,
; text uses the encoding selected by uiEncoding.
bEnableFreeTypeFontRendering = 1

; Write FreeType loading and rendering diagnostics to tnvse.log.
; Enable for troubleshooting; logging adds CPU and disk-I/O overhead.
bEnableFreeTypeFontRenderingLog = 0

; Fixed FreeType source-resolution multiplier. Valid range: 0.1-10.0.
; larger values increase prewarm time, mask storage and atlas usage
; without changing the displayed font size. Default: 1.0.
fFreeTypeFontResolutionScale = 1.0

; CPU memory budget in MB for FreeType glyph, layout, atlas and metadata caches.
; Valid range: 64-384. Default: 128.
uiFreeTypeFontMemoryCacheMB = 128

; Delete stale tNVSE FreeType caches not used by the current configuration.
; Unknown files in the fontdata directory are not deleted. Default: 0.
bDeleteUnusedFreeTypeFontCache = 1

; Let tNVSE create and restore FreeType atlas textures in D3DPOOL_DEFAULT.
; Disable to use the engine-managed atlas path.
bEnableFreeTypeDefaultPoolAtlas = 1

; Use the native distance-field TileShader route when Fallout Shader Loader
; 1.40+ is available. Disable to always use the built-in 32-bit vanilla-shader
; atlas fallback.
bEnableFreeTypeNativeAtlas = 1

; Use the engine-owned vanilla geometry layout for eligible single-page text.
; 0 uses the native facade/CommandBuffer path. Restart after changing it.
; Default: 1.
bEnableFreeTypeFontVanillaLayout = 1

; Skip FreeType text proven outside the interface viewport or Tile scissor.
; Uncertain cases draw normally. Disable when troubleshooting clipped text.
; Default: 1.
bEnableFreeTypeFontPreflightClipCull = 1

; Enable retained FreeType command recording and replay.
; Unsupported rendering states automatically use the normal path.
bEnableFreeTypeFontCommandBuffer = 1

; Select the complete FreeType rendering representation.
; 0 = baked-effect vanilla-like path. Fill/Shadow/Glow/Outline are CPU-composited
;     into a BGRA texture. This minimizes runtime shader cost but scales less well.
; 1 = TSDF in D3DFMT_A8 (lower cache and VRAM use).
; 2 = MTSDF in D3DFMT_A8R8G8B8 (best distance-field edge quality).
; If the native shader route is unavailable, tNVSE uses the ARGB compatibility
; path. Default: 2.
uiFreeTypeFontDistanceFieldMode = 2

; FreeType GPU atlas cache budget in MB.
; 0 forces all configured font atlas snapshots to remain GPU-resident and
; disables software-budget eviction. Nonzero values set the soft budget.
uiFreeTypeFontGpuAtlasCacheMB = 0

; Combine compatible distance-field effect layers in one native Tile draw.
; Incompatible or cross-page text uses the normal effect route.
bEnableFreeTypeFontCompositePass = 1

; Disable FreeType shadow, glow and outline for rich text only in TSDF/MTSDF
; modes. The glyph fill, SDF antialiasing and all other text paths are unchanged.
; 0 = effects enabled, 1 = effects disabled. Default: 0.
bDisableFreeTypeRichTextEffects = 1

; Keep Pip-Boy UI Tweaks search buttons on the magnifier icon while their
; search fields are inactive and empty. Disable only when troubleshooting a
; conflicting Pip-Boy UI replacement. Default: 1.
bFixPipBoySearchIcon = 1

; Independent GPU budget for stable rendered-text composite textures.
; 0 disables retained rendered-text textures.
; Valid range: 0-512. Default: 32.
uiFreeTypeFontCompositeCacheMB = 32

[Multibyte]
; Boolean options use 0 for disabled and 1 for enabled.
; Use the exact section and key names shown in this file.

; Master switch for multibyte font and text hooks.
; FreeTypeFont can remain enabled independently.
; When disabled, uiEncoding is forced to 0 and every option in Multibyte,
; MultibyteInput and Dictionary is disabled for the current run.
bEnableMultibyteFontHook = 1

; Select the encoding used by the game UI. Requires matching game fonts.
; 0: English (Windows-1252, single byte)
; 1: Simplified Chinese (GBK, Windows code page 936)
; 2: Traditional Chinese (Big5, Windows code page 950)
; 3: Japanese (Shift-JIS, Windows code page 932)
; 4: Korean (UHC, Windows code page 949)
uiEncoding = 1

; Detect UTF-8 source text and convert it to the selected UI encoding.
; Requires uiEncoding=1, 2, 3 or 4 and matching game fonts.
bUTF8 = 1

; Replace the Big Guns skill description added by JIP LN NVSE.
; Only supports JIP LN NVSE 57.30.
bChangeJIPBigGunDesc = 1

; Replacement text used when bChangeJIPBigGunDesc=1.
sNewBigGunsDesc = "大型枪械技能决定了你使用所有大型武器的战斗效能，例如胖子发射器、导弹发射器、火焰喷射器、转轮机枪以及激光加特林等。"

; Reorder door/cell activation prompts.
; 0: '(doorname) (sTo GMST) (cellname)' (Default)
; 1: '(sTo)(cellname)(sOptionalStructuralParticle)(doorname)'
; 2: '(cellname)(sTo)(sOptionalStructuralParticle)(doorname)'
; sTo is a game setting and can be edited with GECK or Stewie Tweaks.
uiReorderDoorPrompt = 1

; Optional structural particle inserted by door prompt modes 1 and 2.
; Set to "" to disable it.
sOptionalStructuralParticle = "的"

; Remove the English plural suffix 's' from race labels in the character-generation menu.
bRemovePlural = 1

; Preserve multibyte manual-save display names through a co-save mapping.
bSaveDisplayNameMap = 1

[MultibyteInput]
; Master switch for IME/multibyte text input.
; Requires bEnableMultibyteFontHook=1, successful multibyte hook installation,
; and uiEncoding=1, 2, 3 or 4.
bMultibyteInput = 1

; Write verbose multibyte-input state and event diagnostics to tnvse.log.
; Enable only while troubleshooting because it can produce substantial log output.
bMultibyteInputLog = 0

; Show composition text, candidate entries and IME status in the native Tile
; component loaded from Data\Menus\prefabs\tNVSE\ImeOverlay.xml. The text
; uses native font slot 1 and therefore follows the active tNVSE font setup.
; When disabled, committed IME results are still inserted.
bMultibyteInputCompositionPreview = 1

; The operating-system candidate/composition UI is always suppressed while
; tNVSE multibyte input is installed. If the native Tile XML is unavailable,
; committed text still works but no candidate UI is shown.

; Obtain candidate entries through TSF when available.
; When disabled or unavailable, tNVSE falls back to IMM32 candidate APIs.
bMultibyteInputUseTSFCandidates = 1

; Enable multibyte input for Stewie Tweaks configuration fields and MenuSearch boxes.
; StewMenu text remains UTF-8; MenuSearch text uses the selected UI encoding.
; Requires bMultibyteInput=1. Numeric, float, hex and hotkey fields are not handled.
bMultibyteInputStewieTweaks = 1

; Enable multibyte input for the MCM Extender mod-list search field.
; Requires the JIP LN 57.30 key-event suppression option below.
bMultibyteInputMCMExtender = 1

; Enable multibyte input for the Dialogue History NPC-name search field.
; Requires the JIP LN 57.30 key-event suppression option below.
bMultibyteInputDialogueHistory = 1

; Enable multibyte input for the Modern Help Menu search field.
; Requires the JIP LN 57.30 key-event suppression option below.
bMultibyteInputModernHelpMenu = 1

; Suppress JIP LN OnKeyDown/OnKeyUp keyboard events while a text field owned
; by tNVSE multibyte input has focus. Physical key state is still synchronized,
; so closing the field cannot emit a delayed key-down or an unmatched key-up.
; Mouse/controller events are not changed. Only supports JIP LN NVSE 57.30.
bSuppressJIPKeyEventsDuringMultibyteInput = 1

[Dictionary]
; Master switch for runtime dictionary translation.
; Dictionary sources are configured in Data\NVSE\plugins\tnvse_dictionary.xml.
; ID and full exact lookups are always enabled while this option is enabled.
; All dictionary options below are ignored when this option is disabled.
bEnableDictionaryTranslation = 1

; Disable dictionary matching while the in-game console is open.
; This prevents console commands and output from matching dictionary entries.
; FreeType rendering and multibyte input remain enabled. Set to 0 to allow
; dictionary translation inside the console.
bDisableDictionaryTranslationInConsole = 1

; Write dictionary loading, matching and replacement diagnostics to tnvse.log.
; Enable only while troubleshooting because it can produce substantial log output.
bEnableDictionaryTranslationLog = 0

; Enable the parser for MUX quest prompt segments: Added:, Complete: and Fail:.
bEnableMuxQuestPromptTranslation = 0

; Enable structured translation of perk/trait requirements and descriptions.
; Handles Req:, Ranks:, Source:, Level, AND, OR and NOT fields.
bEnableDictionaryPerkDescriptionTranslation = 1

; Enable structured translation of comma-separated and line-separated item effects.
; Example: "HP +2, Rads +8".
bEnableDictionaryItemEffectTranslation = 1

; Enable structured translation of weapon ammo/multishot text.
; Example: "MF Cell x 3".
bEnableDictionaryMultiplierTextTranslation = 1

; Enable dictionary entries containing the [%] wildcard placeholder.
bEnableDictionaryWildcardTranslation = 1

; Enable <regex /> replacement rules from tnvse_dictionary.xml.
bEnableDictionaryRegexTranslation = 1

; Allow wildcard and translation-regex rules to process source text that
; contains both DBCS characters and ASCII words.
; Requires the corresponding wildcard or regex option.
; Fuzzy and structured translation routes remain disabled for mixed source text.
; Disabled by default to avoid retranslating already localized strings.
bEnableDictionaryMixedSourceTranslation = 0

; Translate each line of multi-line text with exact lookup while preserving original separators.
bEnableDictionaryBeforeLinebreakTranslation = 1

; Retry failed lookups by progressively removing text from either end.
bEnableDictionaryShrinkFuzzyTranslation = 1

; Retry failed lookups with the configured prefix/suffix trim and bypass rules.
bEnableDictionaryTrimBypassFuzzyTranslation = 1
