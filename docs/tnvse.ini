[Main]
; Master switch for multibyte font/text hooks
; When disabled, tNVSE will not install Font/FontManager multibyte text hooks
bEnableMultibyteFontHook = 1

; Select the language the game should display. Require corresponding fonts
; 0: English (ASCII)
; 1: Simplified Chinese (GBK cp936)
; 2: Traditional Chinese (Big5 cp950)
; 3: Japanese (Shift-JIS cp932)
; 4: Korean (UHC cp949)
uiEncoding = 1

; Enable UTF-8 encoding detection. Require correct uiEncoding and corresponding fonts
bUTF8 = 1

; Translate the description of Big Gun skill enabled by JIP
; Only works for JIP LN 57.30
bChangeJIPBigGunDesc = 1

; The description text of Big Gun
sNewBigGunsDesc = "大型枪械技能决定了你使用所有大型武器的战斗效能，例如胖子发射器、导弹发射器、火焰喷射器、转轮机枪以及激光加特林等。"

; Reorder cell prompt
; 0: '(doorname) (sTo GMST) (cellname)' (Default)
; 1: '(sTo)(cellname)(sOptionalStructuralParticle)(doorname)'
; 2: '(cellname)(sTo)(sOptionalStructuralParticle)(doorname)'
; sTo is a gamesetting, you can edit it by GECK or Stewie Tweaks
uiReorderDoorPrompt = 1

; optional structural particle in door prompt, set to "" if you don`t want it
sOptionalStructuralParticle = "的"

; Remove the plural 's' in chargen menu
bRemovePlural = 1

; Enable NVSE co-save mapping for multibyte manual save names
bSaveDisplayNameMap = 1

bMultibyteInput=1
bMultibyteInputDebug=1
bMultibyteInputCompositionPreview=1
bMultibyteInputHideSystemCandidateWindow=1
bMultibyteInputUseTSFCandidates=1

[Dictionary]
; Use translate dictionary(FOZH form) to replace text
bEnableDictionaryTranslation = 0

; Enable detailed logging of dictionary translation
bEnableDictionaryTranslationLog = 1

; Enable hardcoded parser for MUX quest prompt lines: Added:, Complete:, Fail:
bEnableMuxQuestPromptTranslation = 0

; Enable hardcoded parser for perk/trait requirement descriptions: Req:, Ranks:, Source:
bEnableDictionaryPerkDescriptionTranslation=1

; Enable hardcoded parser for item effect lists, such as "HP +2, Rads +8"
bEnableDictionaryItemEffectTranslation=1

; Enable hardcoded parser for weapon ammo/multishot display, such as "MF Cell x 3"
bEnableDictionaryMultiplierTextTranslation=1

; Enable wildcard dictionary entries using [%]
bEnableDictionaryWildcardTranslation=1

; Enable XML <regex /> translation rules in tnvse_dictionary.xml
bEnableDictionaryRegexTranslation=1

; Enable exact per-line dictionary translation for multi-line text while preserving line breaks
bEnableDictionaryBeforeLinebreakTranslation=1

; Enable fuzzy matching by removing extra text from the beginning or end
bEnableDictionaryShrinkFuzzyTranslation=1

; Enable fuzzy matching using trim/bypass rules from tnvse_dictionary.xml
bEnableDictionaryTrimBypassFuzzyTranslation=1