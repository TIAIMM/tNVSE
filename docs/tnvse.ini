[Main]
; Boolean options use 0 for disabled and 1 for enabled.

; Master switch for multibyte font and text hooks.
; When disabled, tNVSE does not install its Font/FontManager text hooks.
bEnableMultibyteFontHook = 1

; Select the encoding used by the game UI. Requires matching game fonts.
; 0: English (ASCII)
; 1: Simplified Chinese (GBK, Windows code page 936)
; 2: Traditional Chinese (Big5, Windows code page 950)
; 3: Japanese (Shift-JIS, Windows code page 932)
; 4: Korean (UHC, Windows code page 949)
uiEncoding = 1

; Detect UTF-8 source text and convert it to the selected UI encoding.
; Requires a non-English uiEncoding and matching game fonts.
bUTF8 = 1

; Replace the Big Guns skill description added by JIP LN NVSE.
; Only supports JIP LN NVSE 57.30.
bChangeJIPBigGunDesc = 1

; Replacement text used when bChangeJIPBigGunDesc=1.
sNewBigGunsDesc = "大型枪械技能决定了你使用所有大型武器的战斗效能，例如胖子发射器、导弹发射器、火焰喷射器、转轮机枪以及激光加特林等。"

; Reorder door/cell activation prompts.
; 0: '(doorname) (sTo GMST) (cellname)' (Default)
; 1: '(sTo)(cellname)(sOptionalStructuralParticle)(doorname)'
; 2: '(cellname)(sTo)(sOptionalStructuralParticle)(doorname)'
; sTo is a game setting and can be edited with GECK or Stewie Tweaks.
uiReorderDoorPrompt = 1

; Optional structural particle inserted by door prompt modes 1 and 2.
; Set to "" to disable it.
sOptionalStructuralParticle = "的"

; Remove the English plural suffix 's' from race labels in the character-generation menu.
bRemovePlural = 1

; Preserve multibyte manual-save display names through an NVSE co-save mapping.
bSaveDisplayNameMap = 1

; Master switch for IME/multibyte text input.
; Requires bEnableMultibyteFontHook=1 and uiEncoding=1, 2, 3 or 4.
bMultibyteInput = 1

; Write verbose multibyte-input state and event diagnostics to tnvse.log.
; Enable only while troubleshooting because it can produce substantial log output.
bMultibyteInputDebug = 1

; Show composition text, candidate entries and IME status in a game-rendered overlay.
; When disabled, committed IME results are still inserted.
bMultibyteInputCompositionPreview = 1

; Hide the operating system candidate window while the tNVSE input overlay is active.
; Requires bMultibyteInputCompositionPreview=1 to provide an in-game replacement.
bMultibyteInputHideSystemCandidateWindow = 1

; Obtain candidate entries through TSF when available.
; When disabled or unavailable, tNVSE falls back to IMM32 candidate APIs.
bMultibyteInputUseTSFCandidates = 1

; Enable multibyte input for Stewie Tweaks configuration fields and MenuSearch boxes.
; StewMenu text remains UTF-8; MenuSearch text uses the selected UI encoding.
; Requires bMultibyteInput=1. Numeric, float, hex and hotkey fields are not handled.
bMultibyteInputStewieTweaks = 1

[Dictionary]
; Master switch for runtime dictionary translation.
; Dictionary sources are configured in Data\NVSE\plugins\tnvse_dictionary.xml.
; ID and full exact lookups are always enabled while this option is enabled.
; All dictionary options below are ignored when this option is disabled.
bEnableDictionaryTranslation = 1

; Write dictionary loading, matching and replacement diagnostics to tnvse.log.
; Enable only while troubleshooting because it can produce substantial log output.
bEnableDictionaryTranslationLog = 1

; Enable the parser for MUX quest prompt segments: Added:, Complete: and Fail:.
bEnableMuxQuestPromptTranslation = 0

; Enable structured translation of perk/trait requirements and descriptions.
; Handles Req:, Ranks:, Source:, Level, AND, OR and NOT fields.
bEnableDictionaryPerkDescriptionTranslation = 1

; Enable structured translation of comma-separated and line-separated item effects.
; Example: "HP +2, Rads +8".
bEnableDictionaryItemEffectTranslation = 1

; Enable structured translation of weapon ammo/multishot text.
; Example: "MF Cell x 3".
bEnableDictionaryMultiplierTextTranslation = 1

; Enable dictionary entries containing the [%] wildcard placeholder.
bEnableDictionaryWildcardTranslation = 1

; Enable <regex /> replacement rules from tnvse_dictionary.xml.
bEnableDictionaryRegexTranslation = 1

; Translate each line of multi-line text with exact lookup while preserving original separators.
bEnableDictionaryBeforeLinebreakTranslation = 1

; Retry failed lookups by progressively removing text from either end.
bEnableDictionaryShrinkFuzzyTranslation = 1

; Retry failed lookups with the configured prefix/suffix trim and bypass rules.
bEnableDictionaryTrimBypassFuzzyTranslation = 1
