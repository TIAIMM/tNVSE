[FreeTypeFont]
; Рендеринг шрифтов, настроенных в разделе <fonts> файла tnvse_fonts.xml,
; с использованием векторных контуров FreeType.
; Параметр работает независимо от bEnableMultibyteFontHook.
; Кодировка текста определяется параметром uiEncoding.
bEnableFreeTypeFontRendering = 1

; Запись диагностики загрузки и рендеринга FreeType в tnvse.log.
; Включение увеличивает нагрузку на процессор и операции записи на диск.
bEnableFreeTypeFontRenderingLog = 1

; Фиксированный множитель исходного разрешения FreeType.
; Допустимый диапазон: 0.1–10.0.
; Большие значения увеличивают время предварительной подготовки,
; объём хранения масок и использование атласа без изменения
; отображаемого размера шрифта. По умолчанию: 1.0.
fFreeTypeFontResolutionScale = 1.0

; Лимит оперативной памяти в МБ для кэшей глифов FreeType,
; раскладки, атласа и метаданных.
; Допустимый диапазон: 64–384. По умолчанию: 128.
uiFreeTypeFontMemoryCacheMB = 128

; Удаление устаревших кэшей FreeType, не используемых текущей конфигурацией.
; Неизвестные файлы в каталоге fontdata не удаляются. По умолчанию: 0.
bDeleteUnusedFreeTypeFontCache = 1

; Создание и восстановление текстур атласа FreeType в D3DPOOL_DEFAULT.
; При отключении используется маршрут атласа, управляемый игровым движком.
bEnableFreeTypeDefaultPoolAtlas = 1

; Использование нативного маршрута TileShader для distance field
; при наличии Fallout Shader Loader версии 1.40 или новее.
; При отключении используется встроенный 32-битный резервный
; вариант vanilla shader для атласа.
bEnableFreeTypeNativeAtlas = 1

; Использование принадлежащей игровому движку vanilla-геометрии
; для подходящего одностраничного текста.
; 0 — использование нативного маршрута facade/CommandBuffer.
; После изменения требуется перезапуск игры.
; По умолчанию: 1.
bEnableFreeTypeFontVanillaLayout = 1

; Предварительное отсечение текста, гарантированно находящегося
; за пределами области интерфейса или Tile scissor.
; В сомнительных случаях используется обычный рендеринг.
; Отключение рекомендуется при диагностике обрезанного текста.
; По умолчанию: 1.
bEnableFreeTypeFontPreflightClipCull = 1

; Сохранение команд рендеринга FreeType и их последующее воспроизведение.
; Неподдерживаемые состояния рендеринга автоматически используют
; обычный маршрут.
bEnableFreeTypeFontCommandBuffer = 1

; Выбор полного представления рендеринга FreeType.
; 0 — маршрут с предварительно запечёнными эффектами, близкий к vanilla.
;     Заливка, тень, свечение и контур объединяются CPU
;     в текстуру BGRA. Снижает нагрузку на шейдеры во время работы,
;     но хуже масштабируется.
; 1 — TSDF в D3DFMT_A8 (меньший расход кэша и VRAM).
; 2 — MTSDF в D3DFMT_A8R8G8B8 (наилучшее качество границ distance field).
; При недоступности нативного маршрута шейдеров используется
; совместимый ARGB-маршрут. По умолчанию: 2.
uiFreeTypeFontDistanceFieldMode = 2

; Лимит GPU-кэша атласов FreeType в МБ.
; 0 — сохранение всех настроенных снимков атласов в GPU
;     и отключение вытеснения по программному лимиту.
; Ненулевое значение задаёт мягкий лимит.
uiFreeTypeFontGpuAtlasCacheMB = 0

; Объединение совместимых слоёв эффектов distance field
; в один нативный Tile draw.
; Несовместимый текст или текст с другой страницей использует
; обычный маршрут эффектов.
bEnableFreeTypeFontCompositePass = 1

; Отключение тени, свечения и контура FreeType только для rich text
; в режимах TSDF/MTSDF.
; Заливка глифов, сглаживание SDF и остальные маршруты текста
; не изменяются.
; 0 — эффекты включены.
; 1 — эффекты отключены. По умолчанию: 0.
bDisableFreeTypeRichTextEffects = 1

; Сохранение кнопок поиска Pip-Boy UI Tweaks в виде значка лупы,
; когда поля поиска неактивны и пусты.
; Отключение используется при диагностике конфликтующего
; интерфейсного мода Pip-Boy. По умолчанию: 1.
bFixPipBoySearchIcon = 1

; Независимый лимит GPU-кэша для стабильных текстур
; композитного рендеринга текста.
; 0 — отключение хранения готовых текстур текста.
; Допустимый диапазон: 0–512. По умолчанию: 32.
uiFreeTypeFontCompositeCacheMB = 32

[Multibyte]
; Логические параметры используют 0 для отключения и 1 для включения.
; Названия секций и параметров соответствуют текущей конфигурации.

; Основной переключатель хуков многобайтного текста и шрифтов.
; FreeTypeFont может работать независимо от этого параметра.
; При отключении многобайтного хука доступна отдельная поддержка
; Windows-1251 через uiEncoding = 5.
bEnableMultibyteFontHook = 0

; Выбор кодировки, используемой интерфейсом игры.
; Требуется соответствующий набор шрифтов.
; 0 — английская (Windows-1252, однобайтная).
; 1 — упрощённый китайский (GBK, Windows code page 936).
; 2 — традиционный китайский (Big5, Windows code page 950).
; 3 — японский (Shift-JIS, Windows code page 932).
; 4 — корейский (UHC, Windows code page 949).
; 5 — русский (Windows-1251, Windows code page 1251).
uiEncoding = 5

; Определение текста в UTF-8 и преобразование в выбранную кодировку интерфейса.
; Для конфигурации Windows-1251 используется значение 0.
bUTF8 = 0

; Замена описания навыка «Большие пушки», добавляемого JIP LN NVSE.
; Поддерживается только JIP LN NVSE 57.30.
bChangeJIPBigGunDesc = 0

; Текст замены при bChangeJIPBigGunDesc = 1.
sNewBigGunsDesc = "Навык «Большие пушки» определяет вашу эффективность при использовании; всех тяжёлых вооружений, включая Ядер-Ядер, ракетную установку, огнемёт, пулемёт и лазерный гатлинг."




; Изменение порядка подсказок активации двери/ячейки.
; 0 — '(doorname) (sTo GMST) (cellname)' (по умолчанию).
; 1 — '(sTo)(cellname)(sOptionalStructuralParticle)(doorname)'.
; 2 — '(cellname)(sTo)(sOptionalStructuralParticle)(doorname)'.
; sTo — игровая настройка, редактируемая через GECK или Stewie Tweaks.
uiReorderDoorPrompt = 0

; Дополнительная структурная частица, вставляемая режимами
; подсказки двери 1 и 2.
; Пустое значение "" отключает её использование.
sOptionalStructuralParticle = ""

; Удаление английского суффикса множественного числа 's'
; из названий рас в меню создания персонажа.
bRemovePlural = 0

; Сохранение отображаемых имён многобайтных ручных сохранений
; посредством сопоставления в co-save.
bSaveDisplayNameMap = 0

[MultibyteInput]
; Основной переключатель ввода текста через IME/многобайтный ввод.
; Требуется bEnableMultibyteFontHook = 1, успешная установка
; многобайтного хука и uiEncoding = 1, 2, 3 или 4.
bMultibyteInput = 0

; Запись подробного состояния многобайтного ввода
; и диагностики событий в tnvse.log.
; Включение используется только при диагностике,
; поскольку может значительно увеличить объём журнала.
bMultibyteInputLog = 0

; Отображение текста композиции, вариантов-кандидатов и состояния IME
; в нативном Tile-компоненте из
; Data\Menus\prefabs\tNVSE\ImeOverlay.xml.
; Текст использует нативный слот шрифта 1 и поэтому следует
; активной конфигурации шрифтов tNVSE.
; При отключении результаты подтверждённого ввода
; по-прежнему вставляются.
bMultibyteInputCompositionPreview = 0

; Подавление системного интерфейса кандидатов/композиции ОС
; при установленном многобайтном вводе tNVSE.
; При отсутствии нативного Tile XML подтверждённый текст
; по-прежнему работает, но интерфейс кандидатов не отображается.

; Получение вариантов-кандидатов через TSF при его доступности.
; При отключении или недоступности используется резервный
; API кандидатов IMM32.
bMultibyteInputUseTSFCandidates = 0

; Включение многобайтного ввода для полей конфигурации Stewie Tweaks
; и полей поиска MenuSearch.
; Текст StewMenu остаётся в UTF-8, текст MenuSearch использует
; выбранную кодировку интерфейса.
; Требуется bMultibyteInput = 1.
; Числовые поля, поля float, hex и горячих клавиш не обрабатываются.
bMultibyteInputStewieTweaks = 0

; Включение многобайтного ввода для поля поиска списка модов MCM Extender.
; Требуется расположенный ниже параметр подавления событий клавиатуры JIP LN 57.30.
bMultibyteInputMCMExtender = 0

; Включение многобайтного ввода для поля поиска имён NPC
; в Dialogue History.
; Требуется расположенный ниже параметр подавления событий клавиатуры JIP LN 57.30.
bMultibyteInputDialogueHistory = 0

; Включение многобайтного ввода для поля поиска Modern Help Menu.
; Требуется расположенный ниже параметр подавления событий клавиатуры JIP LN 57.30.
bMultibyteInputModernHelpMenu = 0

; Подавление событий клавиатуры OnKeyDown/OnKeyUp JIP LN
; при фокусе текстового поля, принадлежащего многобайтному вводу tNVSE.
; Физическое состояние клавиш при этом синхронизируется,
; поэтому закрытие поля не вызывает отложенного нажатия
; или несоответствующего отпускания клавиши.
; События мыши и контроллера не изменяются.
; Поддерживается только JIP LN NVSE 57.30.
bSuppressJIPKeyEventsDuringMultibyteInput = 0

[Dictionary]
; Основной переключатель перевода через словарь во время работы игры.
; Источники словаря настраиваются в
; Data\NVSE\plugins\tnvse_dictionary.xml.
; Точные сопоставления по ID и полному тексту всегда включены
; при активации этого параметра.
; Все расположенные ниже параметры словаря игнорируются
; при его отключении.
bEnableDictionaryTranslation = 0

; Отключение сопоставления словаря при открытой внутриигровой консоли.
; Предотвращает сопоставление команд и вывода консоли
; с записями словаря.
; Рендеринг FreeType и многобайтный ввод продолжают работать.
; Значение 0 разрешает перевод словаря внутри консоли.
bDisableDictionaryTranslationInConsole = 0

; Запись диагностики загрузки, сопоставления и замены словаря
; в tnvse.log.
; Включение используется только при диагностике,
; поскольку может значительно увеличить объём журнала.
bEnableDictionaryTranslationLog = 0

; Включение анализатора сегментов подсказок квестов MUX:
; Added:, Complete: и Fail:.
bEnableMuxQuestPromptTranslation = 0

; Включение структурированного перевода требований и описаний
; перков/черт.
; Обрабатываются поля Req:, Ranks:, Source:, Level, AND, OR и NOT.
bEnableDictionaryPerkDescriptionTranslation = 0

; Включение структурированного перевода эффектов предметов,
; разделённых запятыми и переводами строк.
; Пример: "HP +2, Rads +8".
bEnableDictionaryItemEffectTranslation = 0

; Включение структурированного перевода текста боеприпасов
; и количества выстрелов оружия.
; Пример: "MF Cell x 3".
bEnableDictionaryMultiplierTextTranslation = 0

; Включение записей словаря с подстановочным символом [%].
bEnableDictionaryWildcardTranslation = 0

; Включение правил замены <regex /> из tnvse_dictionary.xml.
bEnableDictionaryRegexTranslation = 0

; Разрешение обработки подстановочных и регулярных правил перевода
; для исходного текста, содержащего одновременно символы DBCS
; и слова ASCII.
; Требуется соответствующий параметр подстановочного или
; регулярного перевода.
; Нечёткий и структурированный перевод смешанного текста
; остаётся отключённым.
; По умолчанию отключено для предотвращения повторного перевода
; уже локализованных строк.
bEnableDictionaryMixedSourceTranslation = 0

; Перевод каждой строки многострочного текста с использованием
; точного сопоставления при сохранении исходных разделителей.
bEnableDictionaryBeforeLinebreakTranslation = 0

; Повторная попытка неудачного сопоставления с последовательным
; удалением текста с одного из концов строки.
bEnableDictionaryShrinkFuzzyTranslation = 0

; Повторная попытка неудачного сопоставления с использованием
; настроенного удаления префикса/суффикса и правил обхода.
bEnableDictionaryTrimBypassFuzzyTranslation = 0